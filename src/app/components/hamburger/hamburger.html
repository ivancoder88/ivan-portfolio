<button (click)="toggle()" type="button" [aria-expanded]="isActive()"
    class="group md:hidden relative flex items-center justify-center rounded-md p-2 text-gray-800 hover:bg-gray-100 transition-colors focus:outline-2 focus:-outline-offset-1 focus:outline-indigo-500 w-10 h-10">
    <span class="sr-only">{{ isActive() ? 'Close main menu' : 'Open main menu' }}</span>
    <div class="relative flex flex-col justify-between w-6 h-4">
        <span class="w-full h-0.5 bg-current rounded-full transition-all duration-300 ease-in-out origin-center group-aria-expanded:rotate-45 group-aria-expanded:translate-y-[7px]"></span>
        <span class="w-full h-0.5 bg-current rounded-full transition-all duration-300 ease-in-out group-aria-expanded:opacity-0"></span>
        <span class="w-full h-0.5 bg-current rounded-full transition-all duration-300 ease-in-out origin-center group-aria-expanded:-rotate-45 group-aria-expanded:-translate-y-[7px]"></span>
    </div>
</button>
